<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Production-grade enterprise SaaS CRM platform for multi-industry sales, customer relationships, pipeline automation, invoices, and operations." />
    <meta property="og:title" content="ORVEXA CRM — Enterprise SaaS Relationship & Revenue Operations" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('orvexa_theme');
          var theme = saved || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
